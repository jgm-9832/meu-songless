<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Songless</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h3>S O N G L E S S</h3>
    <p class="subtitle">adivinhe a música da sua playlist</p>
    
    <div id="streak-display">🔥 Sequência: 0</div>

    <div class="categories">
      <button class="cat-btn active">🇧🇷 Brasileiras</button>
      <button class="cat-btn">🌍 Gringas</button>
      <button class="cat-btn">🌐 Todas</button>
    </div>

    <div class="difficulties">
      <button class="diff-btn">Easy</button>
      <button class="diff-btn">Medium</button>
      <button class="diff-btn">Hard</button>
      <button class="diff-btn">Expert</button>
      <button class="diff-btn impossible">Impossible</button>
    </div>

    <div class="progress">
      <div class="box" id="box-0"></div>
      <div class="box" id="box-1"></div>
      <div class="box" id="box-2"></div>
      <div class="box" id="box-3"></div>
      <div class="box" id="box-4"></div>
      <div class="box" id="box-5"></div>
    </div>

    <div id="album-cover-area" style="display: none;">
        <img id="album-cover" src="" alt="Capa do Álbum">
        <p id="musica-revelada"></p>
        
        <div class="mini-player-controls">
           <button id="vibe-play-pause-btn">⏸️ Pausar</button>
           <a id="spotify-link-btn" href="#" target="_blank">🟢 Ver no Spotify</a>
        </div>

        <button id="next-round-btn">Próxima Rodada ⏭</button>
    </div>

    <div class="player-area">
        <button id="play-btn">▶</button>
        <span id="tempo-display">1s</span>
    </div>

    <div id="status-msg">Pronto para jogar!</div>

    <div class="search-area">
      <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
        <input type="text" id="chute" placeholder="🔍 Digite o nome da música..." autocomplete="off">
        <button id="enviar-btn">Skip ⏭</button>
      </div>
      <ul id="lista-pesquisa" class="dropdown-list"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
